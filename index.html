<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape From School</title>
  <meta name="description" content="Escape From School — jogo do projeto de Robótica do Fund 1. Por Felipe, Ana Elisa e Anabela." />
  <style>
    :root {
      --bg: #0f1020;
      --accent: #ffd166;
      --accent2: #ef476f;
      --text: #f4f4ff;
      --muted: #a9aad0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    /* Desenho realista de fundo: escola ao entardecer */
    .cenario {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: #1f2450;
    }

    .cenario svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .nuvem {
      animation: flutuarNuvem 22s ease-in-out infinite alternate;
    }

    .nuvem.lenta { animation-duration: 32s; }
    .nuvem.rapida { animation-duration: 16s; }

    @keyframes flutuarNuvem {
      from { transform: translateX(-24px); }
      to   { transform: translateX(24px); }
    }

    .bandeira {
      transform-origin: 1352px 220px;
      animation: tremular 2s ease-in-out infinite alternate;
    }

    @keyframes tremular {
      from { transform: rotate(-5deg); }
      to   { transform: rotate(5deg); }
    }

    .luz-poste {
      animation: piscar 4s ease-in-out infinite;
    }

    @keyframes piscar {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(620px, 100%);
      text-align: center;
      padding: 44px 32px 40px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(13, 15, 30, 0.74);
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .emoji {
      font-size: 58px;
      line-height: 1;
      display: inline-block;
      animation: flutuar 3s ease-in-out infinite;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
    }

    @keyframes flutuar {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-10px) rotate(4deg); }
    }

    h1 {
      margin-top: 14px;
      font-size: clamp(2rem, 6vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      background: linear-gradient(100deg, var(--accent), #ff9f68 45%, var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tagline {
      margin-top: 14px;
      font-size: 1.05rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .botao-jogar {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
      padding: 16px 52px;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #231a05;
      cursor: pointer;
      border: none;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe08a, var(--accent) 55%, #f0b73e);
      box-shadow: 0 10px 0 #b9852a, 0 18px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
    }

    .botao-jogar:hover {
      filter: brightness(1.06);
      transform: translateY(-2px);
      box-shadow: 0 12px 0 #b9852a, 0 22px 34px rgba(0, 0, 0, 0.5);
    }

    .botao-jogar:active {
      transform: translateY(6px);
      box-shadow: 0 4px 0 #b9852a, 0 10px 18px rgba(0, 0, 0, 0.4);
    }

    .botao-jogar:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .autores {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.92rem;
      color: var(--muted);
    }

    .autores strong {
      color: var(--text);
      font-weight: 600;
    }

    /* Aviso ao clicar em jogar (o jogo ainda está sendo construído) */
    .aviso {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(6, 7, 18, 0.72);
      backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .aviso.aberto {
      opacity: 1;
      visibility: visible;
    }

    .aviso-caixa {
      width: min(420px, 100%);
      padding: 34px 28px;
      text-align: center;
      border-radius: 20px;
      border: 1px solid rgba(255, 209, 102, 0.35);
      background: #191b33;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      transform: translateY(12px) scale(0.97);
      transition: transform 0.25s ease;
    }

    .aviso.aberto .aviso-caixa {
      transform: translateY(0) scale(1);
    }

    .aviso-caixa h2 {
      font-size: 1.4rem;
      color: var(--accent);
    }

    .aviso-caixa p {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.5;
    }

    .botao-voltar {
      margin-top: 22px;
      padding: 12px 30px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      background: transparent;
      transition: background 0.2s ease;
    }

    .botao-voltar:hover { background: rgba(255, 255, 255, 0.1); }

    @media (max-width: 480px) {
      .card { padding: 34px 22px 30px; }
      .botao-jogar { padding: 14px 40px; font-size: 1.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>

    <p class="tagline">O sinal bateu... agora é encontrar a saída antes que o portão feche!</p>

    <button type="button" class="botao-jogar" id="botaoJogar">▶ Jogar</button>

      <strong>Felipe &middot; Ana Elisa &middot; Anabela</strong>
    </p>
  </main>

  <!-- Aviso exibido ao clicar em Jogar -->
  <div class="aviso" id="aviso" role="dialog" aria-modal="true" aria-labelledby="tituloAviso">
    <div class="aviso-caixa">
      <h2 id="tituloAviso">Em construção</h2>
      <p>A escola já está pronta, mas o jogo ainda está sendo criado. Volte em breve!</p>
      <button type="button" class="botao-voltar" id="botaoVoltar">Voltar</button>
    </div>
  </div>

  <script>
    const botaoJogar = document.getElementById("botaoJogar");
    const botaoVoltar = document.getElementById("botaoVoltar");
    const aviso = document.getElementById("aviso");

    botaoJogar.addEventListener("click", () => {
      aviso.classList.add("aberto");
      botaoVoltar.focus();
    });

    botaoVoltar.addEventListener("click", () => {
      aviso.classList.remove("aberto");
      botaoJogar.focus();
    });

    document.addEventListener("keydown", (evento) => {
      if (evento.key === "Escape" && aviso.classList.contains("aberto")) {
        aviso.classList.remove("aberto");
        botaoJogar.focus();
      }
    });
  </script>
